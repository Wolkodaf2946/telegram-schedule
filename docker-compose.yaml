services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт открыт только на localhost — для локальной разработки и psql с хоста.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  # Docker создаёт отсутствующую ./logs от root, и бот (не root) не может в неё писать.
  # Этот контейнер один раз при старте отдаёт папку пользователю, от которого работает бот.
  logs-init:
    image: busybox:1.37
    user: root
    command: ["sh", "-c", "mkdir -p /logs/dumps && chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /logs"]
    volumes:
      - ./logs:/logs

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # Процесс работает от имени владельца проекта на хосте, чтобы файлы в ./logs
    # принадлежали ему. На сервере задайте HOST_UID/HOST_GID в .env (id -u / id -g).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # Внутри compose бот ходит в БД по имени сервиса; DATABASE_URL из .env здесь перекрывается.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      LOG_FILE: /logs/bot.log
      USERS_LOG_FILE: /logs/users.log
      DUMP_DIR: /logs/dumps
      # Время в логах — по часовому поясу университета, а не UTC.
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      # JSON-лог и дампы непонятых ответов сайта доступны на хосте в ./logs.
      - ./logs:/logs
    depends_on:
      db:
        condition: service_healthy
      logs-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
